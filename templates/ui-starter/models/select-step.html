<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선택 단계 화면</title><link rel="stylesheet" href="../ai-core-ui.css"><link rel="stylesheet" href="./models.css"></head><body class="{{BODY_CLASS}}"><main class="model-page ui-stack" data-model="select-step" data-states="loading empty error populated selected disabled busy">
<header class="model-head" data-region="header"><div><span class="ui-meta">1 / 2단계</span><h1>이용 기간 선택</h1><p class="ui-hint">한 가지를 고르면 다음 단계로 이동합니다.</p></div><span class="ui-badge">필수</span></header>
<aside class="model-usage"><div><b>언제 사용</b><p>순서대로 하나 또는 여러 조건을 고를 때</p></div><div><b>사용하지 않을 때</b><p>긴 정보를 입력하거나 한 화면에서 비교·처리할 때</p></div></aside>
<section class="model-section ui-stack" data-region="main"><h2>단일 선택</h2><div class="model-list" role="group" aria-label="이용 기간" data-auto-next="true"><button class="model-choice" data-choice aria-pressed="false"><b>36개월</b><span>선택하면 바로 다음 단계로 이동합니다.</span></button><button class="model-choice" data-choice aria-pressed="true"><b>48개월</b><span>월 납입금과 이용 기간이 균형을 이룹니다.</span></button></div><h2>복수 선택</h2><div class="model-list" role="group" aria-label="추가 조건"><button class="model-choice" data-choice data-multiple="true" aria-pressed="true"><b>무보증</b></button><button class="model-choice" data-choice data-multiple="true" aria-pressed="false"><b>정비 포함</b></button></div><div class="model-state" data-state="populated" aria-live="polite"><strong>선택 내용을 확인해 주세요</strong></div></section>
<footer class="model-actions" data-region="footer"><button class="ui-button secondary">이전</button><button class="ui-button" data-step-next>선택 확인</button></footer></main><script src="./models.js"></script></body></html>
