<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입력 화면</title><link rel="stylesheet" href="../ai-core-ui.css"><link rel="stylesheet" href="./models.css"></head><body class="ui-profile-freepass"><main class="model-page ui-stack" data-model="form" data-supported-states="loading empty error populated selected disabled busy">
<header class="model-head" data-region="header"><div><span class="ui-meta">2 / 3단계</span><h1>고객 정보 입력</h1><p class="ui-hint">작성 중 · 자동 저장 대기</p></div><span class="ui-badge">작성 중</span></header>
<aside class="model-usage"><div><b>언제 사용</b><p>값을 새로 입력하거나 기존 값을 수정할 때</p></div><div><b>사용하지 않을 때</b><p>읽기 전용 확인이나 여러 항목 탐색이 중심일 때</p></div></aside>
<form class="model-form model-section" data-region="main"><div class="ui-form-grid"><label class="ui-form-field"><span class="ui-form-label">고객명</span><input required value="VIP 고객"></label><label class="ui-form-field"><span class="ui-form-label">담당자</span><input value="홍길동 과장"></label><label class="ui-form-field"><span class="ui-form-label">연락처</span><input value="010-0000-0000"></label><label class="ui-form-field"><span class="ui-form-label">수수료</span><span class="ui-input-with-suffix"><input inputmode="decimal" value="7"><span class="ui-input-suffix">%</span></span></label><label class="ui-form-field"><span class="ui-form-label">신용</span><select><option>중신용</option><option>저신용</option></select></label><label class="ui-form-field"><span class="ui-form-label">약정주행</span><span class="ui-input-with-suffix"><input inputmode="numeric" value="2만"><span class="ui-input-suffix">km/년</span></span></label><label class="ui-form-field"><span class="ui-form-label">보증금</span><span class="ui-input-with-suffix"><input inputmode="decimal" value="10"><span class="ui-input-suffix">%</span></span></label><label class="ui-form-field"><span class="ui-form-label">선납금</span><span class="ui-input-with-suffix"><input inputmode="decimal" value="0"><span class="ui-input-suffix">%</span></span></label></div><label class="model-field">연락처 확인<input class="model-control" aria-invalid="true" aria-describedby="phone-error" value="010-12"><span class="model-error" id="phone-error">전화번호 형식을 확인해 주세요.</span></label><div class="model-state" data-state="error" hidden aria-live="polite"><strong>입력 내용을 확인해 주세요</strong></div></form>
<footer class="model-actions" data-region="footer"><button class="ui-button secondary">이전</button><button class="ui-button" data-busy>다음</button></footer></main><script src="./models.js"></script></body></html>
