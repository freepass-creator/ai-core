<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>목록 화면</title><link rel="stylesheet" href="../ai-core-ui.css"><link rel="stylesheet" href="./models.css"></head><body class="{{BODY_CLASS}}"><main class="model-page ui-stack" data-model="list" data-states="loading empty error populated selected disabled busy">
<header class="model-head" data-region="header"><div><span class="ui-meta">목록</span><h1>진행 목록</h1><p class="ui-hint">여러 항목을 찾고 하나를 고를 때</p></div><span class="ui-badge">12건</span></header>
<aside class="model-usage"><div><b>언제 사용</b><p>검색·필터 후 항목을 선택할 때</p></div><div><b>사용하지 않을 때</b><p>한 건을 바로 처리하거나 값을 입력할 때</p></div></aside>
<section class="model-section ui-stack" data-region="main"><div class="model-toolbar"><input class="model-control" type="search" aria-label="차량 검색" placeholder="차량·고객 검색"><select class="model-control" aria-label="상태 필터"><option>전체 상태</option><option>진행 중</option></select></div>
<ul class="model-list"><li><button class="model-row" aria-pressed="true"><b>그랜저 하이브리드</b><span>김고객 · 견적 확인</span></button></li><li><button class="model-row" aria-pressed="false"><b>카니발 9인승</b><span>이고객 · 서류 대기</span></button></li><li><button class="model-row" disabled><b>쏘렌토 하이브리드</b><span>접근할 수 없는 항목</span></button></li></ul>
<div class="model-state-switch"><button class="ui-button secondary" data-state-target="loading" data-state-label="불러오는 중입니다">로딩</button><button class="ui-button secondary" data-state-target="empty" data-state-label="표시할 항목이 없습니다">빈 상태</button><button class="ui-button secondary" data-state-target="error" data-state-label="목록을 불러오지 못했습니다">오류</button><button class="ui-button secondary" data-state-target="populated" data-state-label="12건을 불러왔습니다">데이터</button></div><div class="model-state" data-state="populated" aria-live="polite"><strong>12건을 불러왔습니다</strong></div></section>
<footer class="model-actions" data-region="footer"><button class="ui-button">선택 항목 보기</button></footer></main><script src="./models.js"></script></body></html>
