<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PRODUCT_NAME}}</title>
  <link rel="stylesheet" href="./ai-core-ui.css">
</head>
<body class="{{BODY_CLASS}}">
  <main class="ui-page ui-stack">
    <header class="ui-header">
      <span class="ui-meta">{{PROFILE_LABEL}}</span>
      <h1>{{PRODUCT_NAME}}</h1>
      <p class="ui-hint">상단은 정보, 실행은 화면 하단에 둡니다.</p>
    </header>

    <section class="ui-search-region" aria-labelledby="search-label">
      <label id="search-label" for="product-search">검색</label>
      <input class="ui-search" id="product-search" type="search" placeholder="검색어를 입력하세요">
      <p class="ui-hint">검색을 열고 닫아도 현재 목록과 작업 내용을 유지합니다.</p>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">목록</h2>
      <ul class="ui-card-list" data-layout="responsive-grid">
        <li class="ui-card-list__item">
          <a class="ui-card-list__link" href="#detail">
            <span class="ui-card-list__title">카드 제목</span>
            <span class="ui-card-list__meta">두 번째 줄에는 판단에 필요한 핵심 정보만 표시합니다.</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="ui-state" aria-live="polite" hidden>
      로딩·빈 상태·오류·데이터 상태를 각각 구현합니다.
    </section>

    <footer class="ui-bottom-action">
      <button class="ui-button secondary" type="button">취소</button>
      <button class="ui-button" type="button">저장</button>
    </footer>
  </main>
</body>
</html>
