<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{HTML_PRODUCT_NAME}}</title>
  <link rel="stylesheet" href="./ai-core-ui.css">
  <script src="./starter.js" defer></script>
</head>
<body class="{{BODY_CLASS}}" data-profile="{{PROFILE_ID}}">
  <main class="ui-page ui-stack">
    <header class="ui-header">
      <span class="ui-meta">{{PROFILE_LABEL}}</span>
      <h1>{{HTML_PRODUCT_NAME}}</h1>
      <p class="ui-hint">상단은 정보, 실행은 화면 하단에 둡니다.</p>
    </header>

    <section class="ui-search-region" aria-labelledby="search-title">
      <div class="ui-section-heading">
        <h2 id="search-title">검색</h2>
        <button class="ui-button ghost" type="button" data-search-toggle aria-expanded="true" aria-controls="search-controls">검색 접기</button>
      </div>
      <div id="search-controls" class="ui-search-controls">
        <label for="product-search">상품 검색</label>
        <input class="ui-search" id="product-search" type="search" autocomplete="off" placeholder="검색어를 입력하세요">
        <p class="ui-hint">검색을 열고 닫아도 검색어, 선택, 작업 메모를 유지합니다.</p>
      </div>
    </section>

    <section class="ui-work-region" aria-labelledby="list-title" data-current-state="populated">
      <h2 id="list-title">목록</h2>
      <div class="ui-state" data-state="loading" role="status" hidden><p>목록을 불러오는 중입니다.</p></div>
      <div class="ui-state" data-state="empty" role="status" hidden><p>조건에 맞는 항목이 없습니다. 검색어를 바꿔 보세요.</p></div>
      <div class="ui-state ui-alert error" data-state="error" role="alert" hidden>
        <p>목록을 불러오지 못했습니다. 입력 내용은 유지됩니다.</p>
        <button class="ui-button secondary" type="button" data-retry>다시 시도</button>
      </div>
      <div data-state="populated">
        <ul class="ui-card-list" data-layout="responsive-grid">
          <li class="ui-card-list__item" data-search-text="기본 상품 즉시 출고">
            <a class="ui-card-list__link" href="#work-note" data-item-id="sample-basic">
              <span class="ui-card-list__title">기본 상품</span>
              <span class="ui-card-list__meta">즉시 출고 · 핵심 정보만 두 줄 안에 표시</span>
            </a>
          </li>
          <li class="ui-card-list__item" data-search-text="확장 상품 검토 필요">
            <a class="ui-card-list__link" href="#work-note" data-item-id="sample-extended">
              <span class="ui-card-list__title">확장 상품</span>
              <span class="ui-card-list__meta">검토 필요 · 전체 행이 하나의 실행 대상</span>
            </a>
          </li>
        </ul>
      </div>
    </section>

    <section class="ui-card" aria-labelledby="note-title">
      <h2 id="note-title">작업 메모</h2>
      <label class="ui-field" for="work-note">
        <span>메모</span>
        <textarea class="ui-textarea" id="work-note" rows="3" placeholder="검색 중에도 보존할 작업 내용을 입력하세요"></textarea>
      </label>
      <p class="ui-hint" data-selection-status aria-live="polite">선택된 항목 없음</p>
    </section>

    <footer class="ui-bottom-action">
      <button class="ui-button secondary" type="button">취소</button>
      <button class="ui-button" type="button">저장</button>
    </footer>
  </main>
</body>
</html>
