<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>AI Core 기본 골격 — 웹</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/components.css">
  <link rel="stylesheet" href="../design-system/runtime-v2.css">
</head>
<body>
<!--
  웹 기본 골격 — docs/ADAPTIVE_WEB_STANDARD_2026-09-21.md 0·1·2절 그대로:
  모바일의 일 화면을 폭에 맞춰 «목록/대기열 + 상세/작업 (+ 보조·미리보기)» 로 편다.
  업무 규칙·상태·명령·검증은 모바일과 «같다». 바뀌는 것은 배치와 밀도뿐이다.
  좁아지면 한 줄로 접히고, 그때의 동작 자리는 모바일 골격(ui-shell-mobile.html)을 따른다.
  ★이 파일은 «베껴 쓰는 골격»이다. 값과 규칙은 design-system/ 과 registry/ui-ux-features.json 이 정본이다.
-->
<div class="ui-shell ui-shell-web">

  <!-- 데스크톱 유틸리티 도구줄: 검색·거르기·보기·새로고침. 여기서 새 업무 흐름을 만들지 않는다. -->
  <div class="ui-toolbar" role="toolbar" aria-label="목록 도구">
    <label class="ui-field" for="q"><span class="ui-hint">검색</span>
      <input class="ui-input" id="q" type="search" placeholder="차번·고객·계약번호"></label>

    <div class="ui-chip-set" role="group" aria-label="상태로 거르기 (여러 개)">
      <button type="button" class="ui-chip" aria-pressed="true">검토 대기</button>
      <button type="button" class="ui-chip" aria-pressed="false">보완 필요</button>
      <button type="button" class="ui-chip" aria-pressed="false">완료</button>
    </div>

    <div class="ui-segmented" role="group" aria-label="밀도">
      <label><input type="radio" name="density" value="comfortable" checked><span>보통</span></label>
      <label><input type="radio" name="density" value="compact"><span>촘촘히</span></label>
    </div>

    <span class="ui-spacer"></span>
    <button type="button" class="ui-button secondary" aria-pressed="false">내 담당만 보기</button>
    <button type="button" class="ui-button secondary">새로고침</button>
  </div>

  <div class="ui-shell-panels" data-panels="3">

    <!-- ① 목록·대기열 -->
    <section class="ui-panel" aria-labelledby="queue-title">
      <h2 id="queue-title" class="ui-panel-title">대기열 · 24건</h2>
      <label class="ui-select-card">
        <span class="ui-select-card-head">12가 3456 · 스위치플랜
          <input type="radio" name="row" value="C-1201" checked></span>
        <span class="ui-meta">홍길동 · 36개월 · 월 62만원</span>
      </label>
      <label class="ui-select-card">
        <span class="ui-select-card-head">34나 7890 · 프라임구독
          <input type="radio" name="row" value="C-1202"></span>
        <span class="ui-meta">김영희 · 48개월 · 월 55만원</span>
      </label>
      <label class="ui-select-card">
        <span class="ui-select-card-head">56다 1234 · 스위치플랜
          <input type="radio" name="row" value="C-1203" disabled></span>
        <span class="ui-meta">해지 처리 중 — 지금은 고를 수 없다</span>
      </label>
      <p class="ui-hint">목록에서 고른 것이 가운데 패널에 열린다. 화면을 새로 열지 않는다(탐색 깊이를 줄인다).</p>
    </section>

    <!-- ② 상세·작업 — 모바일의 「가운데 = 일 내용」과 같은 내용, 같은 명령 -->
    <section class="ui-panel" aria-labelledby="detail-title">
      <h2 id="detail-title" class="ui-panel-title">계약 검토 · 12가 3456</h2>
      <div class="ui-row">
        <label class="ui-field" for="holder">계약자<input class="ui-input" id="holder" value="홍길동"></label>
        <label class="ui-field" for="term">기간<input class="ui-input" id="term" value="36개월"></label>
      </div>
      <label class="ui-field" for="memo">검토 메모<textarea class="ui-input" id="memo" rows="4"></textarea></label>
      <p class="ui-meta">검증·저장·완료의 뜻은 모바일과 같다. 데스크톱이라고 다른 업무 규칙을 만들지 않는다.</p>

      <!-- 웹에서는 같은 명령을 줄 안에 둘 수 있다. 모바일에서는 이 두 개가 아래 동작 막대(3:7)가 된다. -->
      <div class="ui-workflow-actions">
        <button type="button" class="ui-button secondary">임시 저장</button>
        <button type="submit" class="ui-button">검토 완료</button>
      </div>
    </section>

    <!-- ③ 보조·이력·미리보기 (선택) -->
    <aside class="ui-panel" aria-labelledby="side-title">
      <h2 id="side-title" class="ui-panel-title">이력</h2>
      <ul class="ui-list">
        <li><span>접수</span><span class="ui-meta">09-20 10:12</span></li>
        <li><span>서류 보완 요청</span><span class="ui-meta">09-21 14:03</span></li>
        <li><span>재접수</span><span class="ui-meta">09-22 09:41</span></li>
      </ul>
      <p class="ui-hint">보조 패널은 선택이다. 없으면 두 패널(<code>data-panels</code> 기본값)로 쓴다.</p>
    </aside>

  </div>
</div>
</body>
</html>
