<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>AI Core 작업 페이지 골격 — 패널 · 작업버튼 · 입력창 · 표</title>
  <link rel="stylesheet" href="../design-system/tokens.runtime.css">
  <link rel="stylesheet" href="../design-system/components.css">
  <link rel="stylesheet" href="../design-system/runtime-v2.css">
</head>
<body>
<!--
  작업 페이지 골격 — «패널 안에 작업버튼·입력창·표가 들어가는» 실제 업무 화면이다.
  면의 층: 바탕(--color-bg) → 패널(--color-surface) → 패널 안의 박스(--color-surface-subtle) → 선택(--color-selected-surface)
  선은 값 넣는 자리(입력·검색·드롭다운·파일)와 표·목록의 «읽기 위한» 줄에만 남는다.
  ★베껴 쓰는 골격이다. 값과 규칙의 정본은 design-system/ 과 docs/SCREEN_DESIGN_STANDARD.md 다.
-->
<div class="ui-shell ui-shell-web">

  <!-- 머리띠: 어디에 있는지 + 읽기만 하는 상태. 여기에 작업 버튼을 두지 않는다. -->
  <header class="ui-appbar">
    <div class="ui-appbar-context">계약 관리 · 스위치플랜</div>
    <div class="ui-appbar-title">계약 검토 · 12가 3456</div>
  </header>

  <!-- 도구줄: 찾기·거르기·보기. 업무를 «바꾸는» 명령은 여기가 아니라 각 패널 안에 둔다. -->
  <div class="ui-toolbar" role="toolbar" aria-label="목록 도구">
    <label class="ui-field" for="q"><span class="ui-hint">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>검색</span>
      <input class="ui-input" id="q" type="search" placeholder="차번 · 고객 · 계약번호"></label>

    <div class="ui-chip-set" role="group" aria-label="상태로 거르기">
      <button type="button" class="ui-chip" aria-pressed="true">검토 대기</button>
      <button type="button" class="ui-chip" aria-pressed="false">보완 필요</button>
      <button type="button" class="ui-chip" aria-pressed="false">완료</button>
    </div>

    <span class="ui-spacer"></span>
    <button type="button" class="ui-button secondary">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>새로고침</button>
  </div>

  <div class="ui-shell-panels" data-panels="2">

    <!-- ① 목록 패널 — 패널(흰 면) 안의 카드는 «옅은 면»으로 한 단 내려온다 -->
    <section class="ui-panel" aria-labelledby="queue-title">
      <h2 id="queue-title" class="ui-panel-title">대기열 · 24건</h2>
      <label class="ui-select-card">
        <span class="ui-select-card-head">12가 3456 · 스위치플랜
          <input type="radio" name="row" value="C-1201" checked></span>
        <span class="ui-meta">홍길동 · 36개월 · 월 62만원</span>
      </label>
      <label class="ui-select-card">
        <span class="ui-select-card-head">34나 7890 · 프라임구독
          <input type="radio" name="row" value="C-1202"></span>
        <span class="ui-meta">김영희 · 48개월 · 월 55만원</span>
      </label>
      <label class="ui-select-card">
        <span class="ui-select-card-head">56다 1234 · 스위치플랜
          <input type="radio" name="row" value="C-1203" disabled></span>
        <span class="ui-meta">해지 처리 중 — 지금은 고를 수 없다</span>
      </label>
    </section>

    <!-- ② 작업 패널 — 여기에 «작업버튼 · 입력창 · 표»가 모두 들어간다 -->
    <section class="ui-panel" aria-labelledby="work-title">
      <h2 id="work-title" class="ui-panel-title">계약 검토</h2>

      <!-- 읽기만 하는 상태는 뱃지로. 선이 아니라 면과 글자 굵기로 말한다. -->
      <p class="ui-meta">
        상태 <span class="ui-badge">검토 대기</span>
        <span class="ui-badge" data-tone="warning">서류 1건 미비</span>
      </p>

      <!-- 입력창: 값을 넣는 자리라서 «선이 남는» 유일한 부류다 -->
      <div class="ui-row">
        <label class="ui-field" for="holder">계약자<input class="ui-input" id="holder" value="홍길동"></label>
        <label class="ui-field" for="phone">연락처<input class="ui-input" id="phone" value="010-1234-5678"></label>
      </div>
      <div class="ui-row">
        <label class="ui-field" for="term">계약 기간
          <select class="ui-select" id="term">
            <option>36개월</option><option>48개월</option><option>60개월</option>
          </select></label>
        <label class="ui-field" for="fee">월 이용료<input class="ui-input ui-tabular" id="fee" value="620,000"></label>
      </div>
      <label class="ui-field" for="email">정산 이메일
        <input class="ui-input" id="email" type="email" value="hong@" aria-invalid="true" aria-describedby="email-error">
        <span class="ui-error" id="email-error">이메일 형식이 아닙니다.</span></label>
      <label class="ui-field" for="memo">검토 메모<textarea class="ui-textarea" id="memo" rows="3"></textarea></label>

      <!-- 표: 데이터를 «읽기 위한» 가로줄만 남는다. 세로줄·바깥 테두리는 쓰지 않는다. -->
      <h3 class="ui-panel-title">납입 내역</h3>
      <table class="ui-table">
        <thead><tr><th>회차</th><th>청구일</th><th>상태</th><th class="ui-table-number">금액</th></tr></thead>
        <tbody>
          <tr><td>1</td><td>2026-07-05</td><td>완납</td><td class="ui-table-number ui-tabular">620,000</td></tr>
          <tr><td>2</td><td>2026-08-05</td><td>완납</td><td class="ui-table-number ui-tabular">620,000</td></tr>
          <tr><td>3</td><td>2026-09-05</td><td>미납</td><td class="ui-table-number ui-tabular">620,000</td></tr>
        </tbody>
      </table>

      <!-- 알림: 선(왼쪽 강조선) 없이 면으로 말한다 -->
      <div class="ui-alert" role="status">3회차가 미납입니다. 검토 완료 전에 확인하세요.</div>

      <!-- 작업 버튼: 이 패널의 일에 대한 명령. 기본 하나 + 보조들(tonal). -->
      <div class="ui-workflow-actions">
        <button type="button" class="ui-button secondary">임시 저장</button>
        <button type="button" class="ui-button secondary">보완 요청</button>
        <button type="submit" class="ui-button">검토 완료</button>
      </div>
    </section>

  </div>

  <!-- 좁은 화면(모바일)에서는 이 막대가 아래 동작 자리가 된다 — 2개는 3:7 -->
  <div class="ui-bottom-actions" data-actions="2">
    <button type="button" class="ui-button secondary">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>목록</button>
    <button type="submit" class="ui-button">검토 완료</button>
  </div>

</div>
</body>
</html>
