<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>AI Core 기본 골격 — 모바일</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/components.css">
  <link rel="stylesheet" href="../design-system/runtime-v2.css">
</head>
<body>
<!--
  모바일 기본 골격 — docs/ADAPTIVE_WEB_STANDARD_2026-09-21.md 0절 그대로:
  위 = 상태·제목·맥락 / 가운데 = 일 내용 / 아래 = 그 일의 동작.
  동작 2개는 3:7, 3개는 3:3:4. 목록은 카드가 기본. 한 번에 하나의 일 화면.
  ★이 파일은 «베껴 쓰는 골격»이다. 값과 규칙은 design-system/ 과 registry/ui-ux-features.json 이 정본이다.
-->
<div class="ui-shell ui-shell-mobile">

  <header class="ui-appbar">
    <div class="ui-appbar-context">계약 · 진행 중</div>
    <div class="ui-appbar-title">계약 검토</div>
    <p class="ui-meta">머리에는 제목·맥락·읽기만 하는 상태를 둔다. 여기에 작업 버튼을 두지 않는다.</p>
  </header>

  <main class="ui-shell-body">

    <!-- 걸러 보기: 칩 (form.chip) — 다중 선택, 선택 상태는 aria-pressed 로 말한다 -->
    <section class="ui-card ui-stack" aria-labelledby="filter-title">
      <h2 id="filter-title" class="ui-panel-title">걸러 보기</h2>
      <div class="ui-chip-set" role="group" aria-label="상태로 거르기 (여러 개 고를 수 있음)">
        <button type="button" class="ui-chip" aria-pressed="true">검토 대기</button>
        <button type="button" class="ui-chip" aria-pressed="false">보완 필요</button>
        <button type="button" class="ui-chip" aria-pressed="false">완료</button>
        <button type="button" class="ui-chip" aria-pressed="false" disabled>보관</button>
      </div>
      <p class="ui-hint">선택은 색만으로 말하지 않는다 — 체크 표시와 두꺼운 테두리가 함께 바뀐다.</p>
    </section>

    <!-- 보기 방식: 구간 선택 (navigation.segmented) — 값 선택이지 화면 전환이 아니다 -->
    <section class="ui-card ui-stack" aria-labelledby="view-title">
      <h2 id="view-title" class="ui-panel-title">보기</h2>
      <div class="ui-segmented" role="group" aria-label="정렬 기준">
        <label><input type="radio" name="sort" value="recent" checked><span>최근</span></label>
        <label><input type="radio" name="sort" value="due"><span>기한</span></label>
        <label><input type="radio" name="sort" value="amount"><span>금액</span></label>
      </div>
    </section>

    <!-- 목록: 선택 카드 (data.select-card) — 카드 하나가 하나의 선택이다 -->
    <section class="ui-stack" aria-labelledby="list-title">
      <h2 id="list-title" class="ui-panel-title">계약 목록</h2>
      <label class="ui-select-card">
        <span class="ui-select-card-head">12가 3456 · 스위치플랜
          <input type="radio" name="contract" value="C-1201" checked></span>
        <span class="ui-meta">홍길동 · 36개월 · 월 62만원</span>
      </label>
      <label class="ui-select-card">
        <span class="ui-select-card-head">34나 7890 · 프라임구독
          <input type="radio" name="contract" value="C-1202"></span>
        <span class="ui-meta">김영희 · 48개월 · 월 55만원</span>
      </label>
      <label class="ui-select-card">
        <span class="ui-select-card-head">56다 1234 · 스위치플랜
          <input type="radio" name="contract" value="C-1203" disabled></span>
        <span class="ui-meta">해지 처리 중 — 지금은 고를 수 없다</span>
      </label>
    </section>

    <!-- 눌림 토글 (action.toggle) — 이름은 그대로 두고 눌림만 바뀐다 -->
    <section class="ui-card ui-stack" aria-labelledby="toggle-title">
      <h2 id="toggle-title" class="ui-panel-title">내가 맡은 것만</h2>
      <button type="button" class="ui-button secondary" aria-pressed="false">내 담당만 보기</button>
      <p class="ui-hint">누르면 aria-pressed 가 true 가 된다. 이름을 「전체 보기」로 바꾸지 않는다.</p>
    </section>

  </main>

  <!-- 아래 = 이 일의 동작. 2개는 3:7 -->
  <div class="ui-bottom-actions" data-actions="2">
    <button type="button" class="ui-button secondary">뒤로</button>
    <button type="submit" class="ui-button">검토 완료</button>
  </div>

</div>

<!-- 동작이 3개일 때는 3:3:4 (같은 골격, 비율만 다르다)
<div class="ui-bottom-actions" data-actions="3">
  <button type="button" class="ui-button secondary">뒤로</button>
  <button type="button" class="ui-button secondary">임시 저장</button>
  <button type="submit" class="ui-button">검토 완료</button>
</div>
-->
</body>
</html>
