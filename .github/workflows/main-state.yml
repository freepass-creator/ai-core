name: Main State Consistency

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm test
      - run: node scripts/verify-main-state.mjs
      # The registry is a canonical file, so it must be checked like one. It sat
      # outside CI until 2026-09-17, which is how an INVALID registry could have
      # been merged and looked fine.
      - run: npm run registry:validate registry/projects.json
      - run: npm run capability:validate
      - run: npm run direction:validate
      - run: npm run workmap:validate
      - run: npm run contracts:validate
      - run: npm run contracts:compat
        env:
          CONTRACT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
      - run: npm run contracts:adoption
