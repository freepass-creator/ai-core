name: Main State Consistency

# Full repository validation is expensive and is intentionally reserved for
# changes that can alter executable behavior, canonical registries/contracts,
# machine-readable integration policy, or shared runtime authority.
#
# Markdown-only documentation/handoff edits do not start GitHub Actions, except
# executable AI entrypoints that are themselves covered by repository tests.
# A PR exact-head run is sufficient; the same full suite is not repeated on
# push to main after a reviewed PR merge.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'CLAUDE.md'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'contracts/**'
      - 'registry/**'
      - 'design-system/**'
      - 'devcenter/**'
      - 'shared-services/**'
      - 'config/**'
      - 'examples/**/*.json'
      - 'docs/**/*.json'
      - 'management-support/**/*.json'
      - 'management-support/**/*.js'
      - 'management-support/**/*.mjs'
      - 'management-support/**/*.cjs'
      - 'management-support/**/*.ts'
      - 'management-support/**/*.tsx'
      - 'management-support/**/*.py'
  workflow_dispatch:

concurrency:
  group: main-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm test
      - run: node scripts/verify-main-state.mjs
      # The registry is a canonical file, so it must be checked like one. It sat
      # outside CI until 2026-09-17, which is how an INVALID registry could have
      # been merged and looked fine.
      - run: npm run registry:validate registry/projects.json
      - run: npm run a:coverage:validate
      - run: npm run a:evidence:validate
      - run: npm run a:routing:validate
      - run: npm run a:receiver:validate
      - run: npm run a:claim:validate
      - run: npm run a:receiver:intake:check
      - run: npm run a:review:check
      - run: npm run capability:validate
      - run: npm run direction:validate
      - run: npm run workmap:validate
      - run: npm run closeout:validate
      - run: npm run contracts:validate
      - run: npm run contracts:compat
      - run: npm run contracts:adoption
      - run: npm run workflow:validate
      - run: npm run workflow:projection:validate
      - run: npm run workflow:progression:validate
      - run: npm run workflow:bridge:validate
      - run: npm run workflow:recovery:validate
      - run: npm run uiux:validate
      - run: npm run uiux:runtime
      - run: npm run design:react:check
      - run: npm run design:react:typecheck
