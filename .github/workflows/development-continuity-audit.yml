name: Development Continuity Audit

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: development-continuity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Audit development continuity and prune contained branch debt
        run: npm run continuity:audit -- --profile COMPLEX --fetch --cleanup-contained --min-age-hours 24
