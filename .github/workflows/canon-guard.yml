name: Canon Guard

# 정본 지킴이 — 같은 관심사에 정본이 둘 생기거나, main 밖 계보가 운영을 쥐거나,
# 묵은 가지·겹치는 PR 로 정본이 갈리는 것을 PR 단계에서 막는다.
# 규칙은 각 저장소의 registry/canonical-development-lines.json 이 정한다.
#
# 다른 저장소는 이 파일을 그대로 부른다(.github/workflows/canon-guard.yml):
#   on: pull_request
#   jobs:
#     canon:
#       uses: freepass-creator/ai-core/.github/workflows/canon-guard.yml@<ai-core 커밋>
#       with: { ai_core_ref: <같은 커밋> }
on:
  pull_request:
  workflow_call:
    inputs:
      ai_core_ref:
        description: AI Core revision whose canon-guard to run (pin a commit)
        type: string
        default: main

permissions:
  contents: read
  pull-requests: read

jobs:
  canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch AI Core canon-guard
        if: github.repository != 'freepass-creator/ai-core'
        uses: actions/checkout@v4
        with:
          repository: freepass-creator/ai-core
          ref: ${{ inputs.ai_core_ref }}
          path: .canon-guard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate guard
        run: |
          if [ -d .canon-guard ]; then echo "GUARD=.canon-guard" >> "$GITHUB_ENV"; else echo "GUARD=." >> "$GITHUB_ENV"; fi
      - name: Guard proves it still catches known-bad samples
        run: node "$GUARD/scripts/canon-guard.mjs" --self-test
      - name: One canonical line per concern
        run: node "$GUARD/scripts/canon-guard.mjs" --root .
      - name: Branch stays near main and does not contest a canonical path
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node "$GUARD/scripts/check-branch-discipline.mjs" --root . --base "${{ github.base_ref }}"
