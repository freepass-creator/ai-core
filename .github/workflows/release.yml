name: Release Gate and Production Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run release:validate
      - run: node --test test/release-control.test.mjs

  production:
    if: github.event_name == 'push'
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Deploy once and verify the exact production revision
        env:
          RELEASE_PROJECT_ID: ai-core
        run: npm run release:deploy -- --sha "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/release-status/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
